<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>

    <!-- Il vecchio file CSS è eliminato: non serve più grazie a Tailwind -->
    <!-- <link rel="stylesheet" href="style.css" /> -->

    <!-- CDN di TailwindCSS: permette di usare le classi di stile senza installare librerie -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Collega il file JavaScript principale con defer, così viene caricato dopo l’HTML -->
    <script src="index.js" defer></script>
  </head>
  <body>
    <div class="flex justify-center pt-8">
      <div class="w-full max-w-lg px-4">
        <div class="font-semibold text-2xl text-center mb-6">
          Cosa (non) faccio oggi?
        </div>

        <!-- Todo text item modificabile inline -->
        <div
          id="todo-text-item"
          contenteditable="true"
          class="w-full p-3 border border-gray-300 rounded-lg mb-4 blue-500"
        >
          Scrivi un'attività
        </div>

        <button
          id="add-todo-button"
          class="w-full bg-blue-500 text-white p-3 rounded-lg hover:bg-blue-600 mb-6"
        >
          Add todo
        </button>

        <div id="todo-list"></div>
      </div>
    </div>
  </body>
</html>
